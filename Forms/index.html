<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- class for label => form-label
    class for input => form-control -->

    <div class="container">
        <h1>Form Demo</h1>
        <!-- mb-3 => margin bottom 3 (specific type of styling) -->
        <form>
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input class="form-control" type="text" placeholder="Email" id="email">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="pass" class="form-label">Password</label>
                        <input class="form-control" type="password" placeholder="Password" id="pass">
                    </div>
                </div>
            </div>

            <!-- To control input size 
            for ,
            large => form-control-lg
            small => form-control-sm -->
            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <input class="form-control-sm" type="text" placeholder="Address" id="address">
            </div>

            <div class="mb-3">
                <select class="form-select">
                    <!-- <select class="form-select-sm" > -->
                    <option selected>Choose your city</option>
                    <option value="1">Mumbai</option>
                    <option value="2">Goa</option>
                    <option value="3">Patna</option>
                </select>
            </div>

            <div class="normal mb-3">
                <input type="checkbox" id="agree">
                <label for="agree">Agree</label>
            </div>

            <!-- BOOTSTRAP STYLE 
            for CHECKBOX => form-check
            INPUT => form-check-input 
            LABEL => form-check-label -->
            <div class="mb-3 form-check">
                <label class="form-check-label" for="agreebs">Agree</label>
                <input class="form-check-input" type="checkbox" id="agreebs">
            </div>

            <!-- FOR RADIO BUTTON -->
            <div class="mb-3 form-check">
                <input class="form-check-input" type="radio" id="radiobs">
                <label class="form-check-label" for="radiobs">Yes/No</label>
            </div>

            <!-- FOR SWITCH  -->
            <div class="mb-3 form-check form-switch">
                <input class="form-check-input" type="checkbox" id="switch">
                <label class="form-check-label" for="switch">Default switch checkbox input</label>
            </div>

        </form>
    </div>
    <script src="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
